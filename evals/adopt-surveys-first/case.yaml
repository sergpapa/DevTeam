schema_version: "1.1"
name: adopt-surveys-first
description: An existing codebase with no docs must be surveyed and brought into the pipeline with an honest baseline, not refactored on sight.
tags: [adopt]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: This project has code but no docs or tests. Get it ready so we can start adding features properly.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?adopt"'
  - name: criteria
    type: llm
    criteria: |
      PASS if the reply surveys what the code is (an Express API with an in-memory store and no tests), and proposes bringing it into the pipeline with a brief, retroactive decision records, and a roadmap whose first milestone stabilizes the missing tests before any new feature.
      FAIL if the reply starts rewriting or refactoring the code, or adds a new feature, before establishing a baseline with tests.
